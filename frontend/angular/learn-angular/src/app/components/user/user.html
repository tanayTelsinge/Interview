<h2>User Profile</h2>
<!-- 1. Simple variable -->
<p>Name : {{name}}</p>
<p>Age: {{ age }}</p>
<p>Role: {{ role }}</p>

<!-- 2. Expression -->
<p>Age after 5 years: {{ age + 5 }}</p>

<!-- 3. String method -->
<p>Uppercase Name: {{ name.toUpperCase() }}</p>

<!-- 4. Ternary -->
<p>Status: {{ age >= 18 ? 'Adult' : 'Minor' }}</p>


<!-- 5. Property of object -->
<p>City: {{ address.city }}</p>
